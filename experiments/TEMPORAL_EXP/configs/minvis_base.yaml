# Base Configuration for MinVIS on Laparoscopic Liver Landmark Dataset (L3D)
experiment_id: "EXPERIMENT_17_minvis"
description: "MinVIS Minimal Video Instance Segmentation on L3D 5-Fold Cross Validation"

# Model Architecture
model:
  name: "minvis_mask2former"
  base_checkpoint: "facebook/mask2former-swin-tiny-ade-semantic"
  num_classes: 3           # 1: ridge, 2: silhouette, 3: ligament
  num_queries: 100
  hidden_dim: 256
  no_object_weight: 0.1

# Dataset & Preprocessing
dataset:
  root_dir: "data/L3D"
  splits_json: "_config/5fold_patient_splits.json"
  image_size: 1024
  stroke_width: 35         # Native canvas stroke width matching TopoNet and EXP15
  clip_len: 3              # Temporal window length for sequential video evaluation
  max_gap: 240             # Max frame gap between adjacent keyframes in video clip

# Training Hyperparameters
training:
  epochs: 40
  batch_size: 4
  grad_accum_steps: 1
  lr_decoder: 1.0e-4
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  mixed_precision: true
  warmup_epochs: 3

# Loss Weights
loss:
  class_weight: 2.0
  mask_weight: 5.0
  dice_weight: 5.0

# Evaluation
evaluation:
  threshold: 0.5
  metrics: ["macro_dice", "micro_dice", "assd", "hd95"]
